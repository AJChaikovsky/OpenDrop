[workspace]
members = [".", "app/src-tauri"]

[package]
name = "opendrop"
version = "0.1.0"
edition = "2024"

[dependencies]
mdns-sd = "0.21.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
