[workspace]
members = [".", "app/src-tauri"]

[package]
name = "opendrop"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
mdns-sd = "0.21.6"
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
rmcp = { version = "3.8.0", features = ["client"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
