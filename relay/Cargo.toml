[package]
name = "opendrop-relay"
version = "0.1.0"
description = "OpenDrop relay: accounts, device registry and presence for the assistant inbox (opt-in)"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
opendrop = { path = ".." }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30"
futures-util = "0.3"
