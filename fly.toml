# Fly.io config for the OpenDrop relay. See docs/relay-hosting.md.
# `app` is a placeholder: `fly launch --no-deploy` (or editing it) sets the
# real name, and the relay's public URL becomes https://<app>.fly.dev.
app = "opendrop-relay-aj"
primary_region = "sjc"

[build]
  dockerfile = "relay/Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  # Devices hold a connection open to show online, and the inbox sweep runs
  # in the server, so the machine must not be stopped when idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# SQLite and the inbox live on this volume, so run exactly one machine.
[mounts]
  source = "relay_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
