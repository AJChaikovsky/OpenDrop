name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend install
        working-directory: app
        run: npm ci

      - name: Frontend tests
        working-directory: app
        run: npm test

      - name: Frontend build (type check; the app crate embeds dist)
        working-directory: app
        run: npm run build

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (whole workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Core tests
        run: cargo test -p opendrop

      - name: Relay tests
        run: cargo test -p opendrop-relay

      - name: App tests
        run: cargo test -p opendrop-app
